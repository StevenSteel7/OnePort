# Samsung My Files
PKG=com.sec.android.app.myfiles
ORIG_NAME='com.sec.android.app.myfiles 15.6.03.3 (1560303000), arm64-v8a + armeabi-v7a, nodpi'
ORIG_SHA256=57a4844af4b8daa1a450ecf30d75a55d2544ede602965306bd707c84ae547840
OUT=MyFiles-1.2.0.apk
MINAPI=34
# Samsung's manifest has no android:icon (One UI themes it); use the bundled One UI 8 adaptive icon,
# mipmap/ic_launcher_my_files_oneui80.
APP_ICON=0x7f100001
# Samsung builds for Android 16; tools/api_backport.py routes the newer APIs through compat_src/ApiCompat.java
# so it also runs on Android 14 and 15.
MIN_SDK=34
APP_PATCH=api_backport.py
# One Recycle bin with Gallery: photos and videos go to Android's MediaStore trash (samsungcompat.MediaTrash).
post_patch() {
  python3 -I tools/myfiles_patch.py work
}
