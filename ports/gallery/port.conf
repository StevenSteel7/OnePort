# Samsung Gallery
PKG=com.sec.android.gallery3d
ORIG_NAME='com.sec.android.gallery3d 15.9.00.45 (1590000045), arm64-v8a, nodpi'
ORIG_SHA256=d3559b7db868dea56887cd66b831f54e2a8f046123769b9f3838d3488c0bbbbe
# Output is named <App>-<release>.apk: the OnePort release that last changed this app.
OUT=Gallery-1.2.0.apk
MINAPI=30
APP_PATCH=gallery_patch.py
# Samsung's Gallery is a system app; here it needs "All files access" to edit/favourite media it didn't create.
# MANAGE_MEDIA lets MediaStore trash/restore/delete requests run without Android's "Allow Gallery to ..." dialog.
PERMS=(android.permission.MANAGE_EXTERNAL_STORAGE android.permission.MANAGE_MEDIA)

# Trashed files live in Android's .trash-storage, which can't be opened by path: route path-based file opens
# through samsungcompat.TrashFiles.
post_patch() {
  python3 -I tools/trash_files_patch.py work
}
