# Samsung Video Player (beta)
PKG=com.samsung.android.video
ORIG_NAME='com.samsung.android.video 7.4.00.6 (740010006), arm64-v8a, nodpi'
ORIG_SHA256=35f5629bd518a507e47b24b5e185e47589b5a2b8a9b0f9f5bfa7e234356844ba
OUT=Video-1.3.0.apk
MINAPI=31
MIN_SDK=31
APP_PATCH=app_patch.py

# SemMediaPlayer & co. have real implementations in compat_src (on top of android.media.MediaPlayer).
# Remove the generic no-op stubs so only one definition of each class is packaged.
post_patch() {
  find work/smali_classes2/com/samsung/android/media -maxdepth 1 -type f \
    \( -name 'SemMediaPlayer*.smali' -o -name 'SemBackgroundMusic.smali' -o -name 'SemFragmentedBackgroundMusic.smali' \) -delete
  # sendBroadcastAsUser(intent, UserHandle.ALL) needs INTERACT_ACROSS_USERS, which a normal app can't hold (#17):
  # route every call through samsungcompat.ApiCompat, which falls back to the current user.
  python3 -I -c '
import pathlib, re, sys
pat = re.compile(r"invoke-virtual \{([^}]*)\}, Landroid/content/Context;->sendBroadcastAsUser\(Landroid/content/Intent;Landroid/os/UserHandle;\)V")
rep = r"invoke-static {\1}, Lsamsungcompat/ApiCompat;->sendBroadcastAsUser(Landroid/content/Context;Landroid/content/Intent;Landroid/os/UserHandle;)V"
for f in pathlib.Path("work").glob("smali*/**/*.smali"):
    s = f.read_text(encoding="utf-8")
    t = pat.sub(rep, s)
    if t != s: f.write_text(t, encoding="utf-8")
'
}
